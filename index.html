    <script>
      // Clean up any lingering service workers in development or iframe preview
      if ('serviceWorker' in navigator) {
        const isIFrame = window.self !== window.top;
        const isDevHost = window.location.hostname.includes('ais-dev') ||
                          window.location.hostname.includes('localhost') ||
                          window.location.hostname.includes('127.0.0.1') ||
                          window.location.port !== '';

        if (isIFrame || isDevHost) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister().catch(() => {});
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) {
                caches.delete(name).catch(() => {});
              }
            });
          }
        } else if (window.location.protocol.startsWith('http')) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js?v=4').catch((err) => {
              console.log('SW registration note:', err);
            });
          });
        }
      }
    </script>
